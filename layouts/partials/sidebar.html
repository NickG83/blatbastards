{{/* Blat Bastards sidebar */}}

<aside class="home-sidebar">

  <!-- Static About box -->
  <section class="sidebar-box">
    <h3>About Blat Bastards</h3>
    <p>Adventure rides, dirt, bad jokes and good coffee out of Canberra &amp; Yass.</p>
  </section>

  <!-- Recent rides -->
  <section class="sidebar-box">
    <h3>Recent Rides</h3>
    <ul>
      {{ range first 5 (where .Site.RegularPages "Section" "rides") }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </section>

</aside>
